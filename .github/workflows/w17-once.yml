name: W17 approved synthetic acceptance once
'on':
  push:
    branches: [candidate/w17-approved-once-20261123]
permissions:
  contents: read
concurrency:
  group: mcis-w17-approved-once-20261123
  cancel-in-progress: false
jobs:
  w17:
    if: >-
      github.repository == 'mark2wen2023/MCIS' &&
      github.event.created == true && github.event.deleted == false &&
      github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Node 24 (no repository checkout or dependency cache)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          check-latest: false
      - name: Fixed W17 inputs and sandboxed acceptance; summary only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +x
          python3.12 -I -B - <<'PYTHON'
          import base64, hashlib, json, os, platform, re, shutil, signal, subprocess, sys, tempfile, urllib.request
          from pathlib import Path
          SOURCE='74d4e3807dd862f2a4370025074e785c07645407'
          # Embedded constants are supplied by the draft generator; no remote mutable manifest.
          MANIFEST_B64=''
          HELPER_B64=''
          WHEELS=[{'name': 'playwright', 'version': '1.56.0', 'filename': 'playwright-1.56.0-py3-none-manylinux1_x86_64.whl', 'url': 'https://files.pythonhosted.org/packages/e4/76/6d409e37e82cdd5dda3df1ab958130ae32b46e42458bd4fc93d7eb8749cb/playwright-1.56.0-py3-none-manylinux1_x86_64.whl', 'sha256': '404be089b49d94bc4c1fe0dfb07664bda5ffe87789034a03bffb884489bdfb5c', 'size': 46263122}, {'name': 'pyee', 'version': '13.0.0', 'filename': 'pyee-13.0.0-py3-none-any.whl', 'url': 'https://files.pythonhosted.org/packages/9b/4d/b9add7c84060d4c1906abe9a7e5359f2a60f7a9a4f67268b2766673427d8/pyee-13.0.0-py3-none-any.whl', 'sha256': '48195a3cddb3b1515ce0695ed76036b5ccc2ef3a9f963ff9f77aec0139845498', 'size': 15730}, {'name': 'greenlet', 'version': '3.4.0', 'filename': 'greenlet-3.4.0-cp312-cp312-manylinux_2_24_x86_64.manylinux_2_28_x86_64.whl', 'url': 'https://files.pythonhosted.org/packages/36/f7/229f3aed6948faa20e0616a0b8568da22e365ede6a54d7d369058b128afd/greenlet-3.4.0-cp312-cp312-manylinux_2_24_x86_64.manylinux_2_28_x86_64.whl', 'sha256': 'a1c4f6b453006efb8310affb2d132832e9bbb4fc01ce6df6b70d810d38f1f6dc', 'size': 615062}, {'name': 'typing_extensions', 'version': '4.15.0', 'filename': 'typing_extensions-4.15.0-py3-none-any.whl', 'url': 'https://files.pythonhosted.org/packages/18/67/36e9267722cc04a6b9f15c7f3441c2363321a3ea07da7ae0c0707beb2a9c/typing_extensions-4.15.0-py3-none-any.whl', 'sha256': 'f0fa19c6845758ab08074a0cfa8b7aecb71c999ca73d62883bc25cc018c4e548', 'size': 44614}]
          stage='host'; code='FAILED'; exit_code=1
          class NoRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,*a,**k):raise RuntimeError('redirect')
          def run(args, cwd, env, seconds=300):
           global exit_code
           with tempfile.TemporaryFile() as sink:
            p=subprocess.Popen(args,cwd=cwd,env=env,stdout=sink,stderr=sink,start_new_session=True)
            try:r=p.wait(timeout=seconds)
            except subprocess.TimeoutExpired:
             os.killpg(p.pid,signal.SIGKILL);p.wait();raise TimeoutError()
            exit_code=r
            if r:raise RuntimeError('command')
          def output(args):
           return subprocess.check_output(args,stderr=subprocess.DEVNULL,timeout=15).decode().strip()
          try:
           if sys.version_info[:2]!=(3,12) or platform.machine()!='x86_64' or os.geteuid()==0:raise RuntimeError('host')
           if 'VERSION_ID="24.04"' not in Path('/etc/os-release').read_text():raise RuntimeError('os')
           if not output(['node','--version']).startswith('v24.'):raise RuntimeError('node')
           chrome=shutil.which('google-chrome')
           if not chrome:raise RuntimeError('chrome')
           with tempfile.TemporaryDirectory(prefix='w17-ci-',dir=os.environ['RUNNER_TEMP']) as tmp:
            root=Path(tmp); env=dict(os.environ,PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD='1',PIP_DISABLE_PIP_VERSION_CHECK='1',PYTHONDONTWRITEBYTECODE='1')
            manifest=base64.b64decode(MANIFEST_B64,validate=True);helper=base64.b64decode(HELPER_B64,validate=True)
            if hashlib.sha256(manifest).hexdigest()!='acac92b023892f5710757090d1c84714c41ff3298f256f831d7fe96e34c35842':raise RuntimeError('manifest')
            if hashlib.sha256(helper).hexdigest()!='c8afb265f7ade333b013c0b3462e134683ef48ecf32d93e6862ea459b4a83140':raise RuntimeError('helper')
            (root/'manifest.json').write_bytes(manifest);(root/'materialize.py').write_bytes(helper)
            stage='source'
            run([sys.executable,'-I','-B',str(root/'materialize.py'),'--manifest',str(root/'manifest.json'),'--output',str(root/'input'),'--github'],root,env)
            # Only the materializer has the built-in read token. No npm/browser dependency sees it.
            env.pop('GITHUB_TOKEN',None);os.environ.pop('GITHUB_TOKEN',None)
            stage='python_dependencies'
            run([sys.executable,'-m','venv',str(root/'venv')],root,env)
            py=str(root/'venv/bin/python');wheel_dir=root/'wheels';wheel_dir.mkdir()
            opener=urllib.request.build_opener(NoRedirect());req=[]
            for w in WHEELS:
             if not w['url'].startswith('https://files.pythonhosted.org/packages/'):raise RuntimeError('wheel_origin')
             with opener.open(w['url'],timeout=30) as f:raw=f.read(w['size']+1)
             if len(raw)!=w['size'] or hashlib.sha256(raw).hexdigest()!=w['sha256']:raise RuntimeError('wheel_digest')
             (wheel_dir/w['filename']).write_bytes(raw)
             req.append(w['name']+'=='+w['version']+' --hash=sha256:'+w['sha256'])
            (root/'requirements.txt').write_text('\n'.join(req)+'\n')
            run([py,'-m','pip','install','--no-index','--find-links',str(wheel_dir),'--only-binary=:all:','--require-hashes','--no-deps','-r',str(root/'requirements.txt')],root,env)
            run([py,'-m','pip','check'],root,env)
            stage='web_dependencies';tree=root/'input'
            run(['npm','ci','--ignore-scripts','--no-audit','--no-fund'],tree/'web',env)
            stage='build'
            run([str(tree/'web/node_modules/.bin/vite'),'build','--config','web/tests/evidence-page-browser/vite.config.ts'],tree,env)
            stage='browser'
            run([py,'web/tests/evidence-page-browser/check.py','--chromium',chrome,'--dist',str(tree/'.evidence-page-browser-dist'),'--output',str(root/'result')],tree,env,360)
            stage='receipt'
            receipt=json.loads((root/'result/receipt.json').read_text())
            if receipt.get('schema')!='mcis-evidence-page-browser-1' or receipt.get('passed') is not True or receipt.get('externalRequests')!=0:raise RuntimeError('receipt')
            expected=[]
            for width in (1440,390):
             expected += [{'width':width,'touch':False,'late':late,'passed':True} for late in ('data','deny')]
             expected += [{'width':width,'touch':False,'conflicts':c,'passed':True} for c in ('deny','empty','empty','data')]
            if receipt.get('checks')!=expected:raise RuntimeError('checks')
            version=receipt.get('browserVersion','')
            if not re.fullmatch(r'[0-9]+(?:\.[0-9]+){1,3}',version):raise RuntimeError('version')
            # TemporaryDirectory removes raw log, screenshots, sources and outputs before success.
           stage='complete';code='PASS';exit_code=0
          except Exception as e:
           code='TIMEOUT' if isinstance(e,(TimeoutError,subprocess.TimeoutExpired)) else 'FAILED'
           exit_code=exit_code if isinstance(exit_code,int) and exit_code!=0 else 1
          print(json.dumps({'schema':'mcis-ci-summary-1','source':SOURCE,'stage':stage,'result':code,'exitCode':exit_code}))
          sys.exit(0 if code=='PASS' else 1)
          PYTHON
