name: Route classification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  route-classification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install service test dependencies
        run: python -m pip install -r service/requirements.txt
      - name: Verify classified route surface
        working-directory: service
        run: python -m pytest -q tests/test_route_classification*.py
