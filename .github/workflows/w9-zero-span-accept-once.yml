      - name: Verify assets and run W9 with Chrome sandbox enabled
        shell: bash
        run: |
          python3 -I -B - <<'PYTHON'
          import base64, hashlib, json, os, re, shutil, signal, struct, subprocess, tempfile, urllib.request, zlib
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / ("mcis-w9-" + os.environ["GITHUB_RUN_ID"] + "-1")
          product = "de058c65edb59b4069865de49fca06349e32793f"
          pins = {
              "workbench.html": (218430, "ec571d6f120c1463d403b9f8682adef00f6e3777e1f42008bb43baaaf52c0544"),
              "check.cjs": (14558, "342d725e78fef017d167c9b2a722cd28383f53402a1c3b1b4e01ab5d0aa6d631")
          }
          version = "1.62.1"
          deps = {
              "playwright": "sha512-0M+L3LAD8/nm554LOla9Ayx0j0tmFZ0FBcoQ7F1VuVHpM/XpiC8RcDzBQB8W5+hA8L22THxELzeF+2WcUzvcLg==",
              "playwright-core": "sha512-wPYSwEBJY9GHraISXqyqtx0na0LpO3XEX7jNDhntbex7tzUS7kLnZsOlFruFJB4Hi/rhDMjXGqHewDZ68nYZVw==",
          }
          assertions = [
              "new workbench identity, meaningful initial A-t100, two markers",
              "real Tab focus and visible focus outline; narrow navigation Enter toggles",
              "original A-t0 record, fixed input revision and pointer",
              "map click equals keyboard button; T20 original/interpolated/+12; expandable raw record focus",
              "T80 one B point; T124.25 zero; old detail invalidated, no carried-forward position",
              "device +7 and unknown device separate; unknown does not move clock or positions",
              "HDG unknown preserved at four boundaries; no history line bridges either gap",
              "viewport layout order and no whole-page horizontal overflow",
              "no external page requests observed in offline context; no page/console errors",
          ]
          def require(condition):
              if not condition:
                  raise RuntimeError("gate requirement")

          def run(command, env, seconds):
              with tempfile.TemporaryFile(dir=root) as sink:
                  p = subprocess.Popen(command, cwd=root, env=env, stdout=sink, stderr=sink,
                                       start_new_session=True)
                  try:
                      require(p.wait(timeout=seconds) == 0)
                  except subprocess.TimeoutExpired:
                      os.killpg(p.pid, signal.SIGKILL)
                      p.wait()
                      raise

          def png(path, width, height):
              require(path.is_file() and not path.is_symlink() and 256 < path.stat().st_size < 8_000_000)
              data = path.read_bytes()
              require(data[:8] == b"\x89PNG\r\n\x1a\n")
              i, idat, first = 8, [], True
              while i < len(data):
                  size, tag = struct.unpack_from(">I4s", data, i)
                  end = i + 12 + size
                  require(end <= len(data))
                  piece = data[i + 8:i + 8 + size]
                  require(zlib.crc32(tag + piece) == struct.unpack_from(">I", data, end - 4)[0])
                  i = end
                  if first:
                      require(tag == b"IHDR" and size == 13)
                      w, h, depth, mode, c, f, interlace = struct.unpack(">IIBBBBB", piece)
                      require(w == width and height <= h <= 12000 and depth == 8 and mode in (2, 6))
                      require(c == f == interlace == 0)
                      first = False
                  elif tag == b"IDAT":
                      idat.append(piece)
                  elif tag == b"IEND":
                      require(not size and i == len(data))
                      break
              require(not first and bool(idat) and tag == b"IEND")
              step = 3 if mode == 2 else 4
              stride = step * w
              dec = zlib.decompressobj()
              pixels = dec.decompress(b"".join(idat), (stride + 1) * h + 1)
              require(len(pixels) == (stride + 1) * h and dec.eof and not dec.unused_data)
              prev = bytearray(stride)
              colors = set()
              for y in range(h):
                  at = y * (stride + 1)
                  filt = pixels[at]
                  require(filt <= 4)
                  row = bytearray(pixels[at + 1:at + 1 + stride])
                  for x, value in enumerate(row):
                      a, b = (row[x-step] if x >= step else 0), prev[x]
                      c = prev[x-step] if x >= step else 0
                      if filt == 1:
                          value += a
                      elif filt == 2:
                          value += b
                      elif filt == 3:
                          value += (a + b) // 2
                      elif filt == 4:
                          p = a + b - c
                          pa, pb, pc = abs(p - a), abs(p - b), abs(p - c)
                          value += a if pa <= pb and pa <= pc else (b if pb <= pc else c)
                      row[x] = value & 255
                  for x in range(0, stride, step * 3):
                      if step == 3 or row[x + 3] != 0:
                          colors.add(bytes(row[x:x + 3]))
                  if len(colors) >= 16:
                      return {"sha256": hashlib.sha256(data).hexdigest(), "width": w, "height": h}
                  prev = row
              raise RuntimeError("screenshot blank")

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise RuntimeError("redirect denied")

          VIEWPORTS = [('desktop',1440,900),('narrow',390,844)]
          ROW_STAGES = {'context-create','context-close','page-check','viewport-before-t0','after-t0','9.page-and-request-diagnostics',
           't0.select-option','t0.clock','t0.old-record-cleared','t0.old-raw-disabled','t0.old-details-closed',
           't0.button-focus','t0.keyboard-enter','t0.visible-record','t0.visible-pointer','t0.visible-ref',
           't0.details-still-closed','t0.closed-json-read','t0.raw-point','t0.raw-pointer','t0.raw-ref',
           't0.open-details-enter','t0.open-details-visible','t0.open-details-focus','t0.open-visible-json'}
          COUNTS = ('pageExceptions','consoleErrors','consoleWarnings','cspViolations','expectedDocuments','unexpectedRequests')
          def load_safe(path):
              def pairs(items):
                  out={}
                  for k,v in items:
                      require(k not in out);out[k]=v
                  return out
              require(path.is_file() and not path.is_symlink() and 0<path.stat().st_size<24000)
              d=json.loads(path.read_text(),object_pairs_hook=pairs)
              require(set(d)=={'productCommit','htmlSha256','status','stage','browserClosed','failure','cleanupFailure','viewports'})
              require(d['productCommit']==product and d['htmlSha256']==pins['workbench.html'][1])
              require(d['status'] in ('passed','failed') and d['stage'] in ('dependency','launch','desktop','narrow','complete'))
              require(all(type(d[k]) is bool for k in ('browserClosed','failure','cleanupFailure')))
              require(type(d['viewports']) is list and len(d['viewports'])<=2)
              for r,(label,w,h) in zip(d['viewports'],VIEWPORTS):
                  require(set(r)=={'label','viewport','passed','contextCreated','contextClosed','cleanupFailure','screenshots','stage','checks','noPageErrors','noExternalRequests','diagnostics'})
                  require(r['label']==label and r['viewport']=={'width':w,'height':h} and all(type(x) is int for x in r['viewport'].values()))
                  require(r['stage'] in ROW_STAGES)
                  require(all(type(r[k]) is bool for k in ('passed','contextCreated','contextClosed','cleanupFailure','noPageErrors','noExternalRequests')))
                  m=r['diagnostics']
                  require(type(m) is dict and set(m)==set(COUNTS))
                  require(all(type(m[k]) is int and 0<=m[k]<=100000 for k in COUNTS))
                  require(r['noPageErrors']==all(m[k]==0 for k in COUNTS[:4]) and r['noExternalRequests']==(m['expectedDocuments']==1 and m['unexpectedRequests']==0))
                  require(type(r['checks']) is list and len(r['checks'])==9)
                  for i,c in enumerate(r['checks'],1):
                      require(set(c)=={'id','passed'} and type(c['id']) is int and c['id']==i and type(c['passed']) is bool)
                  flags=[c['passed'] for c in r['checks']];require(flags==sorted(flags,reverse=True))
                  names=[label+'-'+n+'.png' for n in ('t80','t124-25','device100','layout100')]
                  require(type(r['screenshots']) is list and r['screenshots']==names[:len(r['screenshots'])])
              return d

          def validate_receipt():
              output=root/'result';d=load_safe(output/'result.json')
              require(d['status']=='passed' and d['stage']=='complete' and d['browserClosed'] and not d['failure'] and not d['cleanupFailure'])
              require(len(d['viewports'])==2)
              fixed=output/'fixed-workbench.html'
              require(fixed.is_file() and not fixed.is_symlink() and hashlib.sha256(fixed.read_bytes()).hexdigest()==pins['workbench.html'][1])
              all_shots=set();results=[]
              for r,(label,w,h) in zip(d['viewports'],VIEWPORTS,strict=True):
                  require(r['passed'] and r['contextCreated'] and r['contextClosed'] and not r['cleanupFailure'])
                  require(r['stage']=='9.page-and-request-diagnostics' and r['noPageErrors'] and r['noExternalRequests'] and all(c['passed'] for c in r['checks']))
                  names=[label+'-'+n+'.png' for n in ('t80','t124-25','device100','layout100')]
                  require(r['screenshots']==names)
                  shots=[png(output/n,w,h) for n in names]
                  require(len({s['sha256'] for s in shots})==4)
                  all_shots.update(names)
                  results.append({'label':label,'stage':r['stage'],'passed':True,'completedChecks':9,'pngVerified':True,'diagnostics':r['diagnostics']})
              require({p.name for p in output.glob('*.png')}==all_shots)
              return {'viewports':results,'closed':True}

          def summarize(path, process_exit):
              try:
                  d=load_safe(path)
                  return {'verdict':'failed','stage':d['stage'],'browserClosed':d['browserClosed'],'viewports':[
                      {'label':r['label'],'stage':r['stage'],'completedChecks':sum(c['passed'] for c in r['checks']),'diagnostics':r['diagnostics'],'contextCreated':r['contextCreated'],'contextClosed':r['contextClosed']}
                      for r in d['viewports']]}
              except Exception:
                  return {'verdict':'no_verifiable_result','stage':'receipt'}

          def run_browser(command, env, seconds):
              # The fixed script is invoked once, with the same argv and environment as before.
              with tempfile.TemporaryFile(dir=root) as sink:
                  try:
                      p = subprocess.Popen(command, cwd=root, env=env, stdout=sink, stderr=sink,
                                           start_new_session=True)
                  except OSError:
                      return None, "spawn_failed"
                  try:
                      return p.wait(timeout=seconds), "exited"
                  except subprocess.TimeoutExpired:
                      try:
                          os.killpg(p.pid, signal.SIGKILL)
                      except ProcessLookupError:
                          pass
                      return p.wait(), "timeout"

          def process_status(rc):
              # Preserve the genuine child exit status; encode negative POSIX signals for the action shell.
              return 1 if rc is None or rc == 0 else (128 - rc if rc < 0 else rc)

          def main():
              stage = "host"
              report = {"schema": "mcis-w9-ci-diagnostic-once-v1", "sourceGate": "f9f4e599cdb670d864a5e7e986067216e7105636", "runnerSha256": "342d725e78fef017d167c9b2a722cd28383f53402a1c3b1b4e01ab5d0aa6d631",
                        "productCommit": product, "htmlSha256": pins["workbench.html"][1], "status": "failed"}
              try:
                  require(os.geteuid() != 0 and 'VERSION_ID="24.04"' in Path("/etc/os-release").read_text())
                  require(root.is_dir() and not root.is_symlink())
                  chrome, node, npm = [shutil.which(s) for s in ("google-chrome", "node", "npm")]
                  require(all(ep and Path(ep).is_absolute() for ep in (chrome, node, npm)))
                  clean = root / "home"
                  clean.mkdir(mode=0o700)
                  env = {"PATH": os.environ["PATH"], "HOME": str(clean), "TMPDIR": str(clean), "LANG": "C.UTF-8",
                         "CI": "true", "PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD": "1", "NPM_CONFIG_USERCONFIG": "/dev/null",
                         "NPM_CONFIG_CACHE": str(root / "npm-cache")}
                  ver = subprocess.check_output([node, "--version"], env=env, timeout=10, text=True).strip()
                  require(bool(re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", ver)) and int(ver.split(".")[0][1:]) >= 20)
                  stage = "pinned_inputs"
                  for filename, (length, digest) in pins.items():
                      p = root / filename
                      require(p.is_file() and not p.is_symlink() and p.stat().st_size == length and hashlib.sha256(p.read_bytes()).hexdigest() == digest)
                  stage = "dependencies"
                  # Download only these two immutable stock tarballs; verify trusted integrity independently
                  # before npm sees them. Linux install is offline, local, no lifecycle script or optional package.
                  opener = urllib.request.build_opener(NoRedirect())
                  for package, integrity in deps.items():
                      require(re.fullmatch(r"sha512-[A-Za-z0-9+/]{86}==", integrity) is not None)
                      url = f"https://registry.npmjs.org/{package}/-/{package}-{version}.tgz"
                      with opener.open(url, timeout=35) as response:
                          raw = response.read(16_000_001)
                      require(0 < len(raw) <= 16_000_000)
                      require("sha512-" + base64.b64encode(hashlib.sha512(raw).digest()).decode() == integrity)
                      (root / f"{package}.tgz").write_bytes(raw)
                  (root / "package.json").write_text(json.dumps({"name": "w9-ci", "private": True}))
                  run([npm, "install", "--offline", "--ignore-scripts", "--omit=optional", "--no-audit", "--no-fund",
                       "--no-package-lock", "./playwright-core.tgz", "./playwright.tgz"], env, 80)
                  for package in deps:
                      require(json.loads((root / "node_modules" / package / "package.json").read_text()).get("version") == version)
                  require({p.name for p in (root / "node_modules").iterdir() if not p.name.startswith(".")} == set(deps))
                  stage = "browser"
                  rc, termination = run_browser([node, str(root / "check.cjs"), "--html", str(root / "workbench.html"),
                                                 "--output", str(root / "result"), "--chromium", chrome], env, 220)
                  report["browserProcessExitCode"] = rc
                  report["browserTermination"] = termination
                  if rc != 0 or termination != "exited":
                      report["diagnostic"] = summarize(root / "result" / "result.json", rc)
                      report["stage"] = stage
                      print(json.dumps(report, separators=(",", ":")), flush=True)
                      return process_status(rc)
                  stage = "receipt"
                  report.update(validate_receipt())
                  stage = "complete"
                  report["status"] = "passed"
              except Exception:
                  pass
              report["stage"] = stage
              print(json.dumps(report, separators=(",", ":")), flush=True)
              return 0 if report["status"] == "passed" else 1

          if __name__ == "__main__":
              raise SystemExit(main())
          PYTHON
      - name: Clean temporary files
        if: always()
        shell: bash
        run: |
          [[ ${GITHUB_RUN_ID:?} =~ ^[0-9]+$ ]]
          [[ ${GITHUB_RUN_ATTEMPT:?} = 1 ]]
          rm -rf -- "${RUNNER_TEMP:?}/mcis-w9-${GITHUB_RUN_ID}-1"
