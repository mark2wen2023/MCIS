  /api/v1/analysis/cases:
    get:
      tags: [analysis]
      summary: 分析页可切换案例清单（只读种子）
      description: |
        返回预生成种子中的案例摘要与种子元数据（sha256 自检、mcis-core 版本、W14 交叉核对）。
        种子与旁注不一致时 500 analysis_seed_tampered。角色鉴权并入 R7，本接口目前不校验权限。
      responses:
        '200':
          description: 案例清单
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisCaseList' }
        '500':
          description: 种子被篡改（code=analysis_seed_tampered）
          content:
            application/json:
              schema: { $ref: 'schemas/common.schema.json#/$defs/problem' }
  /api/v1/cases/{caseId}/analysis:
    parameters:
      - $ref: '#/components/parameters/caseId'
    get:
      tags: [analysis]
      summary: 单案例分析页数据（曲线、关键时刻、W14 对比表）
      description: |
        path 参数可以是规范 caseId，也可以是短 key（lily-mary / haili5 / yangze22）。
        YANGZE 22 规范 caseId 为 CJK-2024-1230-YangZe22-VegaDream（与 reports/yangze22/case.json 一致，符合 EvidenceItem.IsValidCaseId）。
        案例不在种子中时 404 analysis_case_not_found；种子被篡改时 500 analysis_seed_tampered。
        海力5 的 whatif 为 null，notes 中说明无 W14 情景的原因。
      responses:
        '200':
          description: 分析页完整数据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisCase' }
        '404':
          description: 无此分析案例（code=analysis_case_not_found）
          content:
            application/json:
              schema: { $ref: 'schemas/common.schema.json#/$defs/problem' }
        '500':
          description: 种子被篡改（code=analysis_seed_tampered）
          content:
            application/json:
              schema: { $ref: 'schemas/common.schema.json#/$defs/problem' }


  /api/v1/cases/{caseId}/environment-observations:
    parameters:
      - { $ref: '#/components/parameters/caseId' }
    get:
      tags: [environment]
      summary: 读取案件环境观测记录（非仿真状态，ais_sim 读取权限）
      responses:
        '200':
          description: 按创建顺序返回；未知量省略或 null，不补值
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/EnvironmentObservation' } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [environment]
      summary: 追加环境观测（调查组 + ais_sim 写权限，不覆盖）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnvironmentObservation' }
      responses:
        '201':
          description: 已保存且同事务记录审计
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvironmentObservation' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /api/v1/cases/{caseId}/metadata:
    parameters:
      - { $ref: '#/components/parameters/caseId' }
    get:
      tags: [cases]
      summary: 读取案件文字档案与并发版本
      responses:
        '200':
          description: 原案件、版本和最近人工修改声明
          content:
            application/json:
              schema: { $ref: 'schemas/case-metadata.schema.json#/$defs/snapshot' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [cases]
      summary: 仅更新五个文字字段，必须匹配版本，原子审计
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: 'schemas/case-metadata.schema.json#/$defs/update' }
      responses:
        '200':
          description: 新档案快照；不更新原始证据或旧报告
          content:
            application/json:
              schema: { $ref: 'schemas/case-metadata.schema.json#/$defs/snapshot' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
