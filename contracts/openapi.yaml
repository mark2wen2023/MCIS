    get:
      tags: [colreg]
      summary: 两版本对比（核查项按规则+船舶配对，时间带按序号对齐）
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/ColregCompare' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/cases/{caseId}/colreg/checks/{checkId}/reviews:
    parameters:
      - { $ref: '#/components/parameters/caseId' }
      - { name: checkId, in: path, required: true, schema: { type: string } }
      - { name: runId, in: query, required: false, schema: { type: string }, description: "目标版本；省略或 active 表示当前激活版本" }
    get:
      tags: [colreg]
      summary: 某版本某核查项的复核历史（理由全文，不截断）
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/ColregCheckReviews' } } } }
        '404': { $ref: '#/components/responses/Problem' }

