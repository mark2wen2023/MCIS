      parameters:
        - { $ref: "#/components/parameters/caseId" }
      responses:
        "200":
          description: 参考来源或非结论性技术结果
          content:
            application/json:
              schema: { $ref: "schemas/rest-preview.schema.json#/$defs/sources" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/cases/{caseId}/human-factors/rest:preview:
    post:
      tags: [human-factors]
      summary: 有来源的工休基线技术预览（非合规结论）
      description: 见rest-preview-v1.md；固定普通休息基线、不处理授权例外、不持久化，角色头不等于认证。
      parameters:
        - { $ref: "#/components/parameters/caseId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "schemas/rest-preview.schema.json#/$defs/input" }
      responses:
        "200":
          description: 参考来源或非结论性技术结果
          content:
            application/json:
              schema: { $ref: "schemas/rest-preview.schema.json#/$defs/preview" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/cases/{caseId}/access-workbench:
    get:
      tags: [redaction]
      summary: 当前案件权限与脱敏配置只读核验
      description: 仅调查组且audit完整读取权限；本地角色头不是认证。见access-workbench-v1.md。
      parameters:
        - { $ref: '#/components/parameters/caseId' }
      responses:
        '200':
          description: 策略、来源与最近50条匹配策略审计，不产生写入
          content:
            application/json:
              schema:
                type: object
                required: [caseId, policy, policySource, policyAudit, identityMode, readOnly]
                properties:
                  caseId: { type: string }
                  policy: { $ref: 'schemas/access-policy.schema.json' }
                  policySource: { enum: [default, saved] }
                  identityMode: { const: local-role-header }
                  readOnly: { const: true }
                  policyAudit:
                    type: object
                    required: [events, limit, hasMore]
                    properties:
                      events:
                        type: array
                        maxItems: 50
                        items: { $ref: 'schemas/audit-event.schema.json' }
                      limit: { const: 50 }
                      hasMore: { type: boolean }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/packages/intakes:preview:
    post:
      tags: [package]
      summary: 基础资料包严格预览，不写入
      description: 见 package-intake-v1.md；仅调查组，32MiB 原包上限。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [contentBase64]
              properties:
                contentBase64: { type: string, contentEncoding: base64 }
      responses:
        "200": { description: 预览或已提交回执，见独立契约 }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/packages/intakes:commit:
    post:
      tags: [package]
      summary: 确认原包摘要后仅新案导入
      description: 见 package-intake-v1.md；仅调查组，32MiB 原包上限。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [contentBase64, sourceSha256, confirmed]
              properties:
                contentBase64: { type: string, contentEncoding: base64 }
                sourceSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
                confirmed: { const: true }
      responses:
        "200": { description: 预览或已提交回执，见独立契约 }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/packages/intakes/{digest}:
    get:
      tags: [package]
      summary: 未知写入结果仅查询已提交回执
      description: 见 package-intake-v1.md；仅调查组，32MiB 原包上限。
      parameters:
        - { name: digest, in: path, required: true, schema: { type: string, pattern: "^[a-f0-9]{64}$" } }
      responses:
