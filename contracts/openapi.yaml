openapi: 3.1.0
info:
  title: MCIS 调查业务服务 REST 接口
  version: 0.1.0
  description: |
    模块③（Python 服务）对 ②Unity 与 ④网页工作台提供的本地接口。只监听 127.0.0.1:8765。
    - 数据结构见 schemas/*.schema.json（JSON Schema 2020-12），字段与 C# 计算核心对齐（camelCase）。
    - 角色与操作者：请求头 X-MCIS-Role（默认 Investigator）、X-MCIS-Operator（URL 编码）。脱敏网关按角色在出口处理。
    - 所有写操作写只追加审计（GET /cases/{caseId}/audit）；例外：PUT /sim/state 是瞬态遥测，不入审计。
    - 错误体统一为 {code, message, detail?}（schemas/common.schema.json#/$defs/problem）。
    - 冒号路径（如 /evidence:verify-all）是“自定义动作”，与资源路径并列，不是路径参数。
servers:
  - url: http://127.0.0.1:8765
security: []
tags:
  - { name: unity, description: Unity 主仿真需要的接口（取案件、取时间线/航迹、推送 SimTime、取跳转命令） }
  - { name: cases }
  - { name: environment }
  - { name: evidence }
  - { name: timeline }
  - { name: interviews }
  - { name: recommendations }
  - { name: colreg }
  - { name: audit }
  - { name: redaction }
  - { name: agents }
  - { name: sim }
  - { name: package }
  - { name: analysis, description: W12 分析页只读接口（预生成种子；运行时按旁注 sha256 自检，不重算 mcis-core / W14） }

components:
  parameters:
    caseId: { name: caseId, in: path, required: true, schema: { type: string }, example: CASE-2026-DEMO-LILY-MARY }
    evidenceId: { name: evidenceId, in: path, required: true, schema: { type: string, pattern: '^EV-[0-9]{3,}$' } }
    recordId: { name: recordId, in: path, required: true, schema: { type: string, pattern: '^IR-[0-9]{2,}$' } }
    statementId: { name: statementId, in: path, required: true, schema: { type: string } }
    recId: { name: recId, in: path, required: true, schema: { type: string, pattern: '^SR-[0-9]{4}-[0-9]{2,}$' } }
    roundNo: { name: roundNo, in: path, required: true, schema: { type: integer, minimum: 1 } }
    role: { name: X-MCIS-Role, in: header, required: false, schema: { $ref: 'schemas/common.schema.json#/$defs/role' } }
    operator: { name: X-MCIS-Operator, in: header, required: false, schema: { type: string } }
  responses:
    Problem:
      description: 错误（400/403/404/409/422/501/502/503）
      content: { application/json: { schema: { $ref: 'schemas/common.schema.json#/$defs/problem' } } }
  schemas:
    EvidenceIntakeMetadata:
      type: object
      additionalProperties: false
      required:
      - title
      - source
      - extractedBy
      - extractedUtc
      - category
      - confidentiality
      - note
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 1000
        source:
          type: string
          minLength: 1
          maxLength: 1000
        extractedBy:
          type: string
          minLength: 1
          maxLength: 200
        extractedUtc:
          type: string
          pattern: ^[1-9][0-9]{3}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
        category:
          enum:
          - VDR
          - AIS
          - ECDIS
          - EngineLog
          - Testimony
          - Photo
          - Document
          - Other
        confidentiality:
          const: Restricted
        note:
          type: string
          maxLength: 2000
    EvidenceIntakeInput:
      type: object
      additionalProperties: false
      required:
      - profile
      - fileName
      - title
      - source
      - extractedBy
      - extractedUtc
      - category
      - confidentiality
      - note
      - contentBase64
      properties:
        profile:
          const: mcis-evidence-intake-v1
        fileName:
          type: string
          minLength: 1
          maxLength: 128
        title:
          type: string
          minLength: 1
          maxLength: 1000
        source:
          type: string
          minLength: 1
          maxLength: 1000
        extractedBy:
          type: string
          minLength: 1
          maxLength: 200
        extractedUtc:
          type: string
          pattern: ^[1-9][0-9]{3}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
        category:
          enum:
          - VDR
          - AIS
          - ECDIS
          - EngineLog
          - Testimony
          - Photo
          - Document
          - Other
        confidentiality:
          const: Restricted
        note:
          type: string
          maxLength: 2000
        contentBase64:
          type: string
          contentEncoding: base64
          maxLength: 11184812
    EvidenceIntakeCommit:
      type: object
      additionalProperties: false
      required:
      - profile
      - fileName
      - title
      - source
      - extractedBy
      - extractedUtc
      - category
      - confidentiality
      - note
      - contentBase64
      - requestDigest
      - confirmed
      properties:
        profile:
          const: mcis-evidence-intake-v1
        fileName:
          type: string
          minLength: 1
          maxLength: 128
        title:
          type: string
          minLength: 1
          maxLength: 1000
        source:
          type: string
          minLength: 1
          maxLength: 1000
        extractedBy:
          type: string
          minLength: 1
          maxLength: 200
        extractedUtc:
          type: string
          pattern: ^[1-9][0-9]{3}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
        category:
          enum:
          - VDR
          - AIS
          - ECDIS
          - EngineLog
          - Testimony
          - Photo
          - Document
          - Other
        confidentiality:
          const: Restricted
        note:
          type: string
          maxLength: 2000
        contentBase64:
          type: string
          contentEncoding: base64
          maxLength: 11184812
        requestDigest:
          type: string
          pattern: ^[0-9a-f]{64}$
        confirmed:
          const: true
    EvidenceIntakePreview:
      type: object
      required:
      - caseId
      - requestDigest
      - sourceSha256
      - fileName
      - byteLength
      - metadata
      - profile
      - warnings
      properties:
        caseId:
          type: string
        requestDigest:
          type: string
        sourceSha256:
          type: string
        fileName:
          type: string
        byteLength:
          type: integer
          minimum: 0
          maximum: 8388608
        metadata:
          $ref: '#/components/schemas/EvidenceIntakeMetadata'
        profile:
          const: mcis-evidence-intake-v1
        warnings:
          type: array
          items:
            type: string
    EvidenceIntakeReceipt:
      type: object
      required:
      - caseId
      - requestDigest
      - sourceSha256
      - fileName
      - byteLength
      - metadata
      - evidenceId
      - registeredUtc
      - registeredBy
      - registeredRole
      - evidence
      - replayed
      properties:
        caseId:
          type: string
        requestDigest:
          type: string
        sourceSha256:
          type: string
        fileName:
          type: string
        byteLength:
          type: integer
          minimum: 0
          maximum: 8388608
        metadata:
          $ref: '#/components/schemas/EvidenceIntakeMetadata'
        evidenceId:
          type: string
        registeredUtc:
          type: string
        registeredBy:
          type: string
        registeredRole:
          enum:
          - Investigator
          - LeadInvestigator
        evidence:
          $ref: schemas/evidence-item.schema.json
        replayed:
          type: boolean
    TrackImportInput:
      type: object
      additionalProperties: false
      required:
      - profile
      - vesselId
      - fileName
      - source
      - timeBasis
      - contentBase64
      properties:
        profile: &w102schema001
          const: mcis-utc-v1
        vesselId: &w102schema002
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$
        fileName: &w102schema003
          type: string
          maxLength: 128
        source: &w102schema004
          type: string
          minLength: 1
          maxLength: 1000
        timeBasis: &w102schema005
          type: string
          minLength: 1
          maxLength: 1000
        contentBase64: &w102schema006
          type: string
          contentEncoding: base64
          maxLength: 1398104
    TrackImportReceipt:
      type: object
      required:
      - caseId
      - vesselId
      - previewDigest
      - sourceSha256
      - reportSha256
      - pointCount
      - sourceEvidenceId
      - reportEvidenceId
      - committedUtc
      - replayed
      properties:
        caseId:
          type: string
        vesselId:
          type: string
        previewDigest:
          type: string
        sourceSha256:
          type: string
        sourceEvidenceId:
          type: string
        reportEvidenceId:
          type: string
        committedUtc:
          type: string
        reportSha256:
          type: string
        pointCount:
          type: integer
          minimum: 1
          maximum: 10000
        replayed:
          type: boolean
    TrackImportPreview:
      type: object
      description: No writes. samplePoints at most 100; issue entries at most 200, issuesTotal
        is complete. timeRange describes accepted candidate rows, not dropped/invalid
        rows. canCommit requires every row valid and vessel track empty. See W10.2-track-input.md.
      required:
      - profile
      - caseId
      - vesselId
      - caseEpochUtc
      - previewDigest
      - sourceSha256
      - fileName
      - source
      - timeBasis
      - rowCount
      - canCommit
      - issues
      - issuesTotal
      - issuesTruncated
      - samplePoints
      - timeRange
      - warnings
      - existingTrackCount
      properties:
        profile:
          type: string
        caseId:
          type: string
        vesselId:
          type: string
        caseEpochUtc:
          type: string
        previewDigest:
          type: string
        sourceSha256:
          type: string
        fileName:
          type: string
        source:
          type: string
        timeBasis:
          type: string
        rowCount:
          type: integer
        canCommit:
          type: boolean
        issues:
          type: array
          maxItems: 200
          items:
            type: object
            required:
            - row
            - field
            - code
            - message
            properties:
              row:
                type: integer
              field:
                type: string
              code:
                type: string
              message:
                type: string
        issuesTotal:
          type: integer
        issuesTruncated:
          type: boolean
        samplePoints:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/TrackPoint'
        timeRange:
          type:
          - object
          - 'null'
          properties:
            firstUtc:
              type: string
            lastUtc:
              type: string
            fromSec:
              type: number
            toSec:
              type: number
        warnings:
          type: array
          items:
            type: string
        existingTrackCount:
          type: integer
    TrackImportCommit:
      type: object
      additionalProperties: false
      required:
      - profile
      - vesselId
      - fileName
      - source
      - timeBasis
      - contentBase64
      - previewDigest
      - confirmed
      properties:
        profile: *w102schema001
        vesselId: *w102schema002
        fileName: *w102schema003
        source: *w102schema004
        timeBasis: *w102schema005
        contentBase64: *w102schema006
        previewDigest:
          type: string
          pattern: ^[0-9a-f]{64}$
        confirmed:
          const: true
    Case: { $ref: 'schemas/case.schema.json' }
    EnvironmentObservation: { $ref: 'schemas/environment-observation.schema.json' }
    Vessel: { $ref: 'schemas/vessel.schema.json' }
    TrackPoint: { $ref: 'schemas/track-point.schema.json' }
    EvidenceItem: { $ref: 'schemas/evidence-item.schema.json' }
    CustodyEvent: { $ref: 'schemas/custody-event.schema.json' }
    TimelineEvent: { $ref: 'schemas/timeline-event.schema.json' }
    Conflict: { $ref: 'schemas/conflict.schema.json' }
    Interview: { $ref: 'schemas/interview.schema.json' }
    Colreg: { $ref: 'schemas/colreg.schema.json' }
    Recommendation: { $ref: 'schemas/recommendation.schema.json' }
    ConsultationRound: { $ref: 'schemas/consultation-round.schema.json' }
    AuditEvent: { $ref: 'schemas/audit-event.schema.json' }
    AgentDraft: { $ref: 'schemas/agent-draft.schema.json' }
    AccessPolicy: { $ref: 'schemas/access-policy.schema.json' }
    SimState: { $ref: 'schemas/sim-state.schema.json#/$defs/state' }
    SimCommand: { $ref: 'schemas/sim-state.schema.json#/$defs/command' }
    CpaRequest: { $ref: 'schemas/core-cpa.schema.json#/$defs/request' }
    CpaResult: { $ref: 'schemas/core-cpa.schema.json#/$defs/result' }
    Report: { $ref: 'schemas/report.schema.json#/$defs/report' }
    ReportSection: { $ref: 'schemas/report.schema.json#/$defs/section' }
    ReportReview: { $ref: 'schemas/report.schema.json#/$defs/review' }
    ReportGisis: { $ref: 'schemas/report.schema.json#/$defs/gisis' }
    ReportPending: { $ref: 'schemas/report.schema.json#/$defs/pending' }
    ReportAudit: { $ref: 'schemas/report.schema.json#/$defs/auditRecord' }
    ReportSnapshot: { $ref: 'schemas/report.schema.json#/$defs/snapshot' }
    IntegrityReport:
      type: object
      description: 与 C# IntegrityCheckReport 对应
      properties:
        isValid: { type: boolean }
        tamperedFiles: { type: array, items: { type: string } }
        missingFiles: { type: array, items: { type: string } }
        extraFiles: { type: array, items: { type: string } }


    ColregRunMeta:
      type: object
      required: [runId, version, kind]
      properties:
        runId: { type: string, description: "版本 id，如 R-0001；路径参数也可写 active 表示当前版本" }
        version: { type: integer, minimum: 1 }
        kind: { type: string, enum: [Seed, Initial, RuleEngine, External] }
        label: { type: string }
        createdUtc: { type: string, format: date-time }
        createdBy: { type: string }
        parentRunId: { type: ["string", "null"] }
        engineVersion: { type: string }
        note: { type: string }
        bandCount: { type: integer }
        checkCount: { type: integer }
        reviewedCount: { type: integer }
        active: { type: boolean }
    ColregEvidenceLink:
      type: object
      required: [evidenceId, registered]
      properties:
        evidenceId: { type: string }
        registered: { type: boolean }
    ColregBandAnnotation:
      type: object
      properties:
        evidenceIds: { type: array, items: { type: string }, description: "时间带上让路/直航结论所链证据；空则 missingEvidence=true，页面显示「缺证据」" }
        links: { type: array, items: { $ref: '#/components/schemas/ColregEvidenceLink' } }
        missingEvidence: { type: boolean }
    ColregReviewHistoryItem:
      type: object
      properties:
        action: { type: string, enum: [confirm, dismiss, modify] }
        reviewStatus: { type: string, enum: [Confirmed, Rejected, Modified] }
        verdictBefore: { type: string }
        verdictAfter: { type: string }
        sourceBefore: { type: string }
        sourceAfter: { type: string }
        reason: { type: string, description: "理由全文，不截断" }
        evidenceIds: { type: array, items: { type: string } }
        operator: { type: string }
        utc: { type: string, format: date-time }
        auditSeq: { type: integer }
        runId: { type: string }
    ColregCheckAnnotation:
      type: object
      properties:
        reviewStatus: { type: string, enum: [Draft, Confirmed, Rejected, Modified], description: "也出现在 colreg 文档 checks[].reviewStatus" }
        reviewedBy: { type: string }
        reviewedAt: { type: string, format: date-time }
        engineVerdict: { type: string, description: "modify 前引擎/种子原判定；confirm 时不写此字段" }
        engineSource: { type: string }
        lastAction: { type: string, enum: [confirm, dismiss, modify] }
        reason: { type: string, description: "最近一次复核理由全文" }
        reviewEvidenceIds: { type: array, items: { type: string } }
        history: { type: array, items: { $ref: '#/components/schemas/ColregReviewHistoryItem' } }
        links: { type: array, items: { $ref: '#/components/schemas/ColregEvidenceLink' } }
        missingEvidence: { type: boolean }
    ColregRunList:
      type: object
      required: [caseId, runs]
      properties:
        caseId: { type: string }
        activeRunId: { type: ["string", "null"] }
        isFictionalDemo: { type: boolean }
        runs: { type: array, items: { $ref: '#/components/schemas/ColregRunMeta' } }
    ColregRun:
      type: object
      description: "单个分析版本。analysis 符合 colreg.schema.json；时间带 evidenceIds、复核人/时间、engineVerdict、理由全文在 annotations（因 colreg.schema additionalProperties=false，不写入分析文档本体）。"
      required: [runId, analysis, annotations]
      properties:
        runId: { type: string }
        version: { type: integer }
        kind: { type: string, enum: [Seed, Initial, RuleEngine, External] }
        label: { type: string }
        createdUtc: { type: string, format: date-time }
        createdBy: { type: string }
        parentRunId: { type: ["string", "null"] }
        engineVersion: { type: string }
        note: { type: string }
        active: { type: boolean }
        analysis: { $ref: '#/components/schemas/Colreg' }
        annotations:
          type: object
          properties:
            bands: { type: object, additionalProperties: { $ref: '#/components/schemas/ColregBandAnnotation' } }
            checks: { type: object, additionalProperties: { $ref: '#/components/schemas/ColregCheckAnnotation' } }
    ColregCompareBrief:
      type: object
      properties:
        checkId: { type: string }
        verdict: { type: string }
        reviewStatus: { type: string }
        source: { type: string }
        title: { type: string }
    ColregCompare:
      type: object
      required: [baseRunId, otherRunId, checks, bands]
      properties:
        baseRunId: { type: string }
        otherRunId: { type: string }
        checks:
          type: array
          items:
            type: object
            properties:
              rule: { type: string }
              vesselId: { type: string }
              base: { type: ["object", "null"], allOf: [{ $ref: '#/components/schemas/ColregCompareBrief' }] }
              other: { type: ["object", "null"], allOf: [{ $ref: '#/components/schemas/ColregCompareBrief' }] }
              verdictChanged: { type: boolean }
        bands:
          type: array
          items:
            type: object
            properties:
              base: { type: ["object", "null"] }
              other: { type: ["object", "null"] }
              changed: { type: boolean }
        changedCheckCount: { type: integer }
        changedBandCount: { type: integer }
    ColregCheckReviews:
      type: object
      required: [caseId, runId, checkId, history]
      properties:
        caseId: { type: string }
        runId: { type: string }
        checkId: { type: string }
        engineVerdict: { type: ["string", "null"] }
        reviewedBy: { type: ["string", "null"] }
        reviewedAt: { type: ["string", "null"], format: date-time }
        history: { type: array, items: { $ref: '#/components/schemas/ColregReviewHistoryItem' } }
    ColregEvaluateResult:
      description: "evaluate 成功响应：colreg 文档 + 本次新建并激活的版本 id"
      allOf:
        - { $ref: '#/components/schemas/Colreg' }
        - type: object
          required: [runId]
          properties:
            runId: { type: string, description: "本次新建并激活的版本 id，如 R-0002。实现暂缺见 W6-D06。" }

    # ----- W12 分析页（2026-11-11 21:52 裁定入合同；实现随 W6.2 将 include_in_schema=True）-----
    AnalysisSourceRef:
      type: object
      required: [path, sha256]
      properties:
        path: { type: string }
        sha256: { type: string, minLength: 64, maxLength: 64 }
        role: { type: string }
        exporter: { type: string }
        generatedAtUtc: { type: string, format: date-time }
    AnalysisCrossCheck:
      type: object
      required: [against, valuesCompared, maxAbsDiff, tolerance, ok]
      properties:
        against: { type: array, items: { type: string } }
        sha256: { type: object, additionalProperties: { type: string } }
        valuesCompared: { type: integer }
        maxAbsDiff: { type: number }
        tolerance: { type: number }
        ok: { type: boolean }
    AnalysisMeta:
      type: object
      required: [seedSha256, seedVerified, generatedAt, generator, coreVersion, coreDll, w14Export, w14Frozen, crossCheck, disclaimer]
      properties:
        seedSha256: { type: string, minLength: 64, maxLength: 64 }
        seedVerified: { type: boolean }
        generatedAt: { type: string }
        generator: { type: string }
        coreVersion: { type: string }
        coreDll: { $ref: '#/components/schemas/AnalysisSourceRef' }
        w14Export: { $ref: '#/components/schemas/AnalysisSourceRef' }
        w14Frozen: { $ref: '#/components/schemas/AnalysisSourceRef' }
        crossCheck: { $ref: '#/components/schemas/AnalysisCrossCheck' }
        disclaimer: { type: string }
    AnalysisCaseListItem:
      type: object
      required: [caseId, key, title, isFictionalDemo, sourceLabel, hasWhatIf]
      properties:
        caseId: { type: string, examples: [CASE-2026-DEMO-LILY-MARY, CASE-2025-HAILI5-WANA17, CJK-2024-1230-YangZe22-VegaDream] }
        key: { type: string, enum: [lily-mary, haili5, yangze22] }
        title: { type: string }
        isFictionalDemo: { type: boolean }
        sourceLabel: { type: string }
        hasWhatIf: { type: boolean }
    AnalysisCaseList:
      allOf:
        - { $ref: '#/components/schemas/AnalysisMeta' }
        - type: object
          required: [cases]
          properties:
            cases: { type: array, items: { $ref: '#/components/schemas/AnalysisCaseListItem' } }
    AnalysisCurvePoint:
      type: object
      required: [t, clock, distanceNm, dcpaNm, tcpaMin, riskLevel]
      properties:
        t: { type: number, description: 相对案件历元的秒 }
        clock: { type: string, description: '北京时间 HH:MM:SS[.cc]' }
        distanceNm: { type: number }
        dcpaNm: { type: ["number", "null"] }
        tcpaMin: { type: ["number", "null"] }
        riskLevel: { type: string, enum: [Safe, Warning, Danger] }
        isDiverging: { type: boolean }
    AnalysisKeyMoment:
      type: object
      required: [kind, label, t, clock, source]
      properties:
        kind: { type: string }
        label: { type: string }
        t: { type: number }
        clock: { type: string }
        value: { type: ["number", "null"] }
        unit: { type: string }
        source: { type: string, description: 必填来源标注 }
    AnalysisBaseline:
      type: object
      required: [label, stepSec, cutAtSec, series, keyMoments]
      properties:
        label: { type: string }
        stepSec: { type: number }
        cutAtSec: { type: number }
        series: { type: array, items: { $ref: '#/components/schemas/AnalysisCurvePoint' } }
        keyMoments: { type: array, items: { $ref: '#/components/schemas/AnalysisKeyMoment' } }
    AnalysisSourcedInput:
      type: object
      properties:
        name: { type: string }
        value: { type: number }
        unit: { type: string }
        source: { type: string }
        sourceText: { type: string }
        reference: { type: string }
        note: { type: string }
    AnalysisScenarioRow:
      type: object
      required: [id, name, verdict, displayVerdictText, isCritical, collision, minClearanceM, series, keyMoments]
      additionalProperties: true
      properties:
        id: { type: string }
        name: { type: string }
        changeSummary: { type: string }
        verdict: { type: string }
        verdictText: { type: string }
        displayVerdictText: { type: string }
        isCritical: { type: boolean }
        criticalReason: { type: string }
        safeDistanceM: { type: number }
        sensitivityRangeText: { type: string }
        collision: { type: boolean }
        tcSeconds: { type: ["number", "null"] }
        tcLocal: { type: string }
        collisionAngleText: { type: string }
        contactPartText: { type: string }
        minClearanceM: { type: number }
        minClearanceTimeSeconds: { type: number }
        minDistanceNm: { type: number }
        minDistanceTimeSeconds: { type: number }
        minDcpaNm: { type: number }
        series: { type: array, items: { $ref: '#/components/schemas/AnalysisCurvePoint' } }
        keyMoments: { type: array, items: { $ref: '#/components/schemas/AnalysisKeyMoment' } }
        trackPlot:
          type: object
          additionalProperties:
            type: array
            items: { type: array, items: { type: number }, minItems: 3, maxItems: 3 }
        vesselDims: { type: object, additionalProperties: true }
        sensitivity: { type: array, items: { type: object, additionalProperties: true } }
    AnalysisAntennaRow:
      type: object
      required: [label, inEstimateRange, outcomes]
      additionalProperties: true
      properties:
        label: { type: string }
        shortLabel: { type: string }
        yangzeAftRatio: { type: number }
        vegaAftRatio: { type: number }
        inEstimateRange: { type: boolean, description: 'false 表示对照行（如天线不改正）' }
        collision: { type: boolean }
        tcLocal: { type: string }
        delayVsReportSec: { type: ["number", "null"] }
        collisionAngleDeg: { type: ["number", "null"] }
        clearanceAtReportTimeM: { type: number }
        contactText: { type: string }
        outcomes:
          type: object
          additionalProperties:
            type: object
            properties:
              collision: { type: boolean }
              verdict: { type: string }
              minClearanceM: { type: number }
    AnalysisWhatIf:
      type: object
      required: [label, ownVesselId, targetVesselId, safeDistanceM, criticalMarginM, stepSec, rows, curveNote]
      properties:
        label: { type: string }
        epochLocal: { type: string }
        ownVesselId: { type: string }
        targetVesselId: { type: string }
        safeDistanceM: { type: number }
        criticalMarginM: { type: number }
        stepSec: { type: number }
        disclaimer: { type: string }
        assumptions: { type: array, items: { type: string } }
        inputs: { type: array, items: { $ref: '#/components/schemas/AnalysisSourcedInput' } }
        rows: { type: array, items: { $ref: '#/components/schemas/AnalysisScenarioRow' } }
        antennaSensitivity:
          oneOf:
            - { type: "null" }
            - type: array
              items: { $ref: '#/components/schemas/AnalysisAntennaRow' }
        curveNote: { type: string, description: '曲线假设（航向作对地航向须标【推算】，见 W12-D01）' }
        originalDeviation: { type: string }
        combinedNote: { type: string }
        reportCollisionLocal: { type: string }
        markdown: { type: string }
    AnalysisCase:
      type: object
      required: [caseId, key, title, isFictionalDemo, sourceLabel, sourceRefs, timeZone, vessels, baseline, whatif, notes, meta]
      properties:
        caseId: { type: string }
        key: { type: string }
        title: { type: string }
        isFictionalDemo: { type: boolean }
        sourceLabel: { type: string }
        sourceRefs: { type: array, items: { $ref: '#/components/schemas/AnalysisSourceRef' } }
        epochLocal: { type: string }
        timeZone: { type: string, description: "固定 UTC+8（北京时间）" }
        vessels:
          type: array
          items:
            type: object
            required: [vesselId, name]
            properties:
              vesselId: { type: string }
              name: { type: string }
        thresholds:
          type: object
          properties:
            dangerDcpaNm: { type: number }
            dangerTcpaMin: { type: number }
            warningDcpaNm: { type: number }
            warningTcpaMin: { type: number }
            presetName: { type: string }
        baseline: { $ref: '#/components/schemas/AnalysisBaseline' }
        whatif:
          oneOf:
            - { $ref: '#/components/schemas/AnalysisWhatIf' }
            - { type: "null" }
        notes: { type: array, items: { type: string } }
        meta: { $ref: '#/components/schemas/AnalysisMeta' }


paths:
