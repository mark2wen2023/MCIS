        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackImportInput'
      responses:
        '200':
          description: 成功（preview不写入；commit仅提交成功或同一原件完整回读）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackImportPreview'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/cases/{caseId}/track-imports:commit:
    post:
      tags:
      - tracks-import
      summary: 人工确认后首次保存，重复相同摘要幂等返回
      description: MCIS-UTC v1 only; request <=1536 KiB, original <=1 MiB, <=10000 rows.
        Investigator/Lead + current write policies. Strict UTC Z. No AIS raw decoder,
        no inference of saturation from 102.2. File/DB exception rollback; process-crash
        orphan files possible.
      parameters: *w102path001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackImportCommit'
      responses:
        '200':
          description: 成功（preview不写入；commit仅提交成功或同一原件完整回读）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackImportReceipt'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/cases/{caseId}/track-imports:
    get:
      tags:
      - tracks-import
      summary: 只读列出本案指定船舶的导入回执，不写审计
      parameters:
      - *w102path002
      - *w102path003
      - *w102path004
      - name: vesselId
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Receipt array; no import => []
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrackImportReceipt'
  /api/v1/cases/{caseId}/track-imports/{digest}:
    get:
      tags:
      - tracks-import
      summary: 只读回执恢复；调查组且当前策略允许；同时校验两原件哈希
      parameters:
      - *w102path002
      - *w102path003
      - *w102path004
      - &w102path005
        name: digest
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{64}$
      responses:
        '200':
          description: 保存回执
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackImportReceipt'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/cases/{caseId}/track-imports/{digest}/{kind}:
    get:
      tags:
      - tracks-import
      summary: 只读原件或导入记录下载，无审计写；当前调查组权限与Restricted策略
      parameters:
      - *w102path002
      - *w102path003
      - *w102path004
      - *w102path005
      - name: kind
        in: path
        required: true
        schema:
          type: string
          enum:
          - source
          - report
      responses:
        '200':
          description: 源CSV逐字节或派生JSON；固定下载名；X-Sha256
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/knowledge/cards:
    get:
      tags: [knowledge]
      summary: 已发布公开或合成知识卡的字面与结构化检索，内部状态仅调查组
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [Published, Candidate, Rejected, Withdrawn], default: Published } }
        - { name: kind, in: query, schema: { type: string, enum: [Case, Challenge, Method] } }
        - { name: tag, in: query, schema: { type: string, maxLength: 40 } }
        - { name: q, in: query, schema: { type: string, maxLength: 160 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
      responses: { '200': { description: items/total/limit/offset }, '403': { description: 未获内部读取权限 } }
    post:
      tags: [knowledge]
      summary: 调查组人工创建不可变知识候选，不自动公开
      requestBody: { required: true, content: { application/json: { schema: { $ref: './schemas/knowledge-card.schema.json' } } } }
      responses: { '201': { description: Candidate }, '403': { description: 禁止 }, '422': { description: 内容或来源不合法 } }
  /api/v1/knowledge/cards/{cardId}:
    get:
      tags: [knowledge]
      parameters: [{ name: cardId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: 知识卡 }, '404': { description: 不存在或不可公开读取 } }
  /api/v1/knowledge/cards/{cardId}/review:
    post:
      tags: [knowledge]
      summary: 首席明确审核发布、驳回或撤回；发布需来源/权利/范围三项审批
      parameters: [{ name: cardId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, expectedDigest, note]
              properties:
                decision: { type: string, enum: [Published, Rejected, Withdrawn] }
                expectedDigest: { type: string, pattern: '^[a-f0-9]{64}$' }
                note: { type: string, minLength: 1, maxLength: 2000 }
                sourceVerified: { type: boolean }
                rightsVerified: { type: boolean }
                releaseApproved: { type: boolean }
      responses: { '200': { description: 审核结果 }, '403': { description: 禁止 }, '409': { description: 版本或状态不符 }, '422': { description: 审批不完整 } }
  /api/v1/knowledge/audit:
    get:
      tags: [knowledge]
      summary: 调查组读取知识库独立审计，不读取案件审计
      responses: { '200': { description: 审计事件 }, '403': { description: 禁止 } }
  /api/v1/knowledge/audit:verify:
    get:
      tags: [knowledge]
      responses: { '200': { description: 哈希链完整性，不证明事实真实性 }, '403': { description: 禁止 } }

  /api/v1/health:
    get: { tags: [cases], summary: 健康检查, responses: { '200': { description: ok } } }

  /api/v1/cases:
    get:
      tags: [cases, unity]
      summary: 案件列表（大厅卡片）
      responses: { '200': { description: 摘要列表 } }
    post:
      tags: [cases]
      summary: 新建案件（审计 case.create）
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Case' } } } }
      responses: { '201': { description: 已创建 }, '409': { $ref: '#/components/responses/Problem' } }
  /api/v1/cases/{caseId}:
    parameters: [{ $ref: '#/components/parameters/caseId' }]
    get:
      tags: [cases, unity]
      summary: 取案件（Unity 启动时调用；caseEpochUtc 决定 SimTime 0 点）
      responses: { '200': { description: 案件, content: { application/json: { schema: { $ref: '#/components/schemas/Case' } } } } }
  /api/v1/cases/{caseId}/overview:
    parameters: [{ $ref: '#/components/parameters/caseId' }]
    get: { tags: [cases], summary: 案件概览计数, responses: { '200': { description: ok } } }
  /api/v1/cases/{caseId}/vessels:
    parameters: [{ $ref: '#/components/parameters/caseId' }]
    get:
      tags: [cases, unity]
      summary: 船舶静态参数
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Vessel' } } } } } }
    post:
      tags: [cases]
      summary: 新增案件船舶（仅调查组且 ais_sim ReadWrite；不覆盖已有船舶）
      description: W9.1 create-only. See W9.1-vessel-entry.md for write validation and source requirements. Existing GET and legacy records unchanged.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Vessel' } } } }
      responses:
        '201': { description: 已保存, content: { application/json: { schema: { $ref: '#/components/schemas/Vessel' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/v1/cases/{caseId}/tracks:
    parameters:
      - { $ref: '#/components/parameters/caseId' }
      - { name: vesselId, in: query, schema: { type: string } }
      - { name: fromSec, in: query, schema: { type: number } }
      - { name: toSec, in: query, schema: { type: number } }
      - { name: stepSec, in: query, schema: { type: number, exclusiveMinimum: 0 }, description: 给出时服务端线性重采样 }
    get:
      tags: [cases, unity]
      summary: 航迹点（按船分组）
      responses: { '200': { description: '{caseId, tracks:[{vesselId, points:TrackPoint[]}]}' } }

  /api/v1/cases/{caseId}/evidence:
    parameters: [{ $ref: '#/components/parameters/caseId' }]
    get:
      tags: [evidence]
      summary: 证据列表（含保管链推导字段；保密证据按角色过滤）
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EvidenceItem' } } } } } }
    post:
      tags: [evidence]
      summary: 登记证据（写保管链 Register + 审计）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, source, extractedBy]
              properties:
                title: { type: string }
                source: { type: string }
                extractedBy: { type: string }
                extractedUtc: { type: string, format: date-time }
                category: { type: string }
                confidentiality: { type: string, enum: [Normal, Restricted] }
                relativePath: { type: string, description: 'raw/ 下为只读，不可覆盖' }
                fileName: { type: string }
                contentBase64: { type: string }
                sha256: { type: string, description: 无内容时必填 }
                note: { type: string }
      responses: { '201': { description: 已登记 }, '409': { $ref: '#/components/responses/Problem' } }
  /api/v1/cases/{caseId}/evidence/{evidenceId}:
    parameters: [{ $ref: '#/components/parameters/caseId' }, { $ref: '#/components/parameters/evidenceId' }]
    get: { tags: [evidence], summary: 单条证据, responses: { '200': { description: ok } } }
    patch:
      tags: [evidence]
      summary: 设置/解除需复核（写保管链 Review 事件，reason 必填）/ 修改备注；登记快照字段（含 confidentiality）不可改
      requestBody: { content: { application/json: { schema: { type: object, properties: { needsReview: { type: boolean }, reason: { type: string }, note: { type: string } } } } } }
      responses: { '200': { description: ok }, '409': { $ref: '#/components/responses/Problem' }, '422': { $ref: '#/components/responses/Problem' } }
  /api/v1/cases/{caseId}/evidence/{evidenceId}/custody:
    parameters: [{ $ref: '#/components/parameters/caseId' }, { $ref: '#/components/parameters/evidenceId' }]
    get:
      tags: [evidence]
      summary: 该证据的保管链事件
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CustodyEvent' } } } } } }
  /api/v1/cases/{caseId}/evidence/{evidenceId}/access:
    parameters: [{ $ref: '#/components/parameters/caseId' }, { $ref: '#/components/parameters/evidenceId' }]
    post:
      tags: [evidence, unity]
      summary: 记录一次访问（Unity 打开 VDR 回放时调用）
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [purpose], properties: { purpose: { type: string } } } } } }
      responses: { '201': { description: 'CustodyEvent' } }
  /api/v1/cases/{caseId}/evidence/{evidenceId}/verify:
    parameters: [{ $ref: '#/components/parameters/caseId' }, { $ref: '#/components/parameters/evidenceId' }]
    post: { tags: [evidence], summary: 重新计算 SHA-256（写 Verify 事件）, responses: { '200': { description: 'CustodyEvent' } } }
  /api/v1/cases/{caseId}/evidence:verify-all:
    parameters: [{ $ref: '#/components/parameters/caseId' }]
    post: { tags: [evidence], summary: 全部重新校验哈希, responses: { '200': { description: '{checked, mismatched, results}' } } }
  /api/v1/cases/{caseId}/evidence/{evidenceId}/content:
    parameters:
      - { $ref: '#/components/parameters/caseId' }
      - { $ref: '#/components/parameters/evidenceId' }
      - { name: purpose, in: query, schema: { type: string } }
    get: { tags: [evidence, unity], summary: 下载原件（同时写 Access 事件）, responses: { '200': { description: octet-stream } } }
  /api/v1/cases/{caseId}/custody:verify-chain:
    parameters: [{ $ref: '#/components/parameters/caseId' }]
    get: { tags: [evidence], summary: 校验保管链 prev 哈希链, responses: { '200': { description: '{valid, count, brokenAt}' } } }

  /api/v1/cases/{caseId}/timeline:
    parameters:
      - { $ref: '#/components/parameters/caseId' }
      - { name: fromSec, in: query, schema: { type: number } }
      - { name: toSec, in: query, schema: { type: number } }
      - { name: includeDrafts, in: query, schema: { type: boolean, default: true } }
    get:
      tags: [timeline, unity]
      summary: 取时间线（Unity 回放轴标记 + 网页时间线）
      responses: { '200': { description: '{caseId, caseEpochUtc, displayTimeZoneOffsetMinutes, durationSec, events: TimelineEvent[]}' } }
  /api/v1/cases/{caseId}/timeline/align-preview:
    parameters: [{ $ref: '#/components/parameters/caseId' }]
    post:
      tags: [timeline]
      summary: Inline CSV 临时对齐预览（timeline读取权限，不写库不审计）
      description: 最多4源，每源256KiB UTF8/总1MiB，每源16列，sourceId唯一。UTC时间，逗号CSV，固定align/calibrate=true；无锚点可能未校准。拒绝全部path、manualAnchors及未知字段。仅此新路由受限；旧裸core/align行为不变。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: 'schemas/align-preview.schema.json#/$defs/request' }
      responses:
        '200':
          description: 未入库临时结果，不改变人工复核
          content:
            application/json:
              schema: { $ref: 'schemas/align-preview.schema.json#/$defs/response' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        '504': { $ref: '#/components/responses/Problem' }
  /api/v1/cases/{caseId}/timeline/events:
    parameters: [{ $ref: '#/components/parameters/caseId' }]
    post:
      tags: [timeline]
      summary: 新增时间线事件（utc 由 timeSec 推导）
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TimelineEvent' } } } }
      responses: { '201': { description: ok } }
  /api/v1/cases/{caseId}/conflicts:
    parameters: [{ $ref: '#/components/parameters/caseId' }, { name: status, in: query, schema: { type: string } }]
    get:
      tags: [timeline]
      summary: 多源冲突列表
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Conflict' } } } } } }
    post:
      tags: [timeline]
      summary: 登记冲突（W2 钟差/冲突检测结果入库）
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Conflict' } } } }
      responses: { '201': { description: ok } }
  /api/v1/cases/{caseId}/conflicts/{conflictId}:
    parameters: [{ $ref: '#/components/parameters/caseId' }, { name: conflictId, in: path, required: true, schema: { type: string } }]
    patch:
      tags: [timeline]
      summary: 更新冲突处理状态
      requestBody: { content: { application/json: { schema: { type: object, properties: { status: { type: string }, resolution: { type: string } } } } } }
      responses: { '200': { description: ok } }

  /api/v1/cases/{caseId}/interviews:
    parameters: [{ $ref: '#/components/parameters/caseId' }]
    get: { tags: [interviews], summary: 笔录摘要列表（已按角色脱敏）, responses: { '200': { description: ok } } }
    post:
      tags: [interviews]
      summary: 新建笔录
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Interview' } } } }
      responses: { '201': { description: ok } }
  /api/v1/cases/{caseId}/interviews/{recordId}:
    parameters: [{ $ref: '#/components/parameters/caseId' }, { $ref: '#/components/parameters/recordId' }]
    get:
      tags: [interviews]
      summary: 笔录全文（按角色脱敏；响应头 X-MCIS-Redaction 列出生效规则；外部角色调阅写审计）
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Interview' } } } }, '403': { $ref: '#/components/responses/Problem' } }
  /api/v1/cases/{caseId}/interviews/{recordId}/turns:
    parameters: [{ $ref: '#/components/parameters/caseId' }, { $ref: '#/components/parameters/recordId' }]
    post: { tags: [interviews], summary: 追加一轮问答, responses: { '201': { description: ok } } }
  /api/v1/cases/{caseId}/interviews/{recordId}/statements:
    parameters: [{ $ref: '#/components/parameters/caseId' }, { $ref: '#/components/parameters/recordId' }]
    post: { tags: [interviews], summary: 登记陈述（quote 由 span 按 UTF-16 下标截取；Agent 抽取的为 Draft）, responses: { '201': { description: ok } } }
  /api/v1/cases/{caseId}/interviews/{recordId}/statements/{statementId}:
    parameters: [{ $ref: '#/components/parameters/caseId' }, { $ref: '#/components/parameters/recordId' }, { $ref: '#/components/parameters/statementId' }]
    patch: { tags: [interviews], summary: 调查员确认/驳回/修改陈述, responses: { '200': { description: ok } } }
  /api/v1/cases/{caseId}/interviews/{recordId}/crosscheck:
    parameters: [{ $ref: '#/components/parameters/caseId' }, { $ref: '#/components/parameters/recordId' }]
    get: { tags: [interviews], summary: 陈述↔数据比对结果（只有 state=Confirmed 生效）, responses: { '200': { description: ok } } }
  /api/v1/cases/{caseId}/interviews/{recordId}/crosscheck/{statementId}:confirm:
    parameters: [{ $ref: '#/components/parameters/caseId' }, { $ref: '#/components/parameters/recordId' }, { $ref: '#/components/parameters/statementId' }]
    post: { tags: [interviews], summary: 确认一条比对结果（审计 interview.contradiction.confirm）, responses: { '200': { description: ok }, '409': { $ref: '#/components/responses/Problem' } } }
  /api/v1/cases/{caseId}/interviews/{recordId}/crosscheck/{statementId}:dismiss:
    parameters: [{ $ref: '#/components/parameters/caseId' }, { $ref: '#/components/parameters/recordId' }, { $ref: '#/components/parameters/statementId' }]
    post: { tags: [interviews], summary: 驳回一条比对结果（必须写理由 note）, responses: { '200': { description: ok } } }
  /api/v1/cases/{caseId}/interviews/{recordId}/crosscheck:confirm-consistent:
    parameters: [{ $ref: '#/components/parameters/caseId' }, { $ref: '#/components/parameters/recordId' }]
    post: { tags: [interviews], summary: 一致项批量确认（矛盾项必须逐条确认）, responses: { '200': { description: ok } } }
  # ---- W5 询问笔录比对页（#interview，原型第 10 页）；W5.1：statementVersion / 过期（stale）/ Resubmit 仅从 Dismissed、旧条目 Superseded ----
  /api/v1/cases/{caseId}/interview-compare:
    parameters: [{ $ref: '#/components/parameters/caseId' }]
    get: { tags: [interviews], summary: 受询问人名单（矛盾只计 Confirmed；N 条待确认 / N 条需重新比对；按角色脱敏）, responses: { '200': { description: ok } } }
  /api/v1/cases/{caseId}/interview-compare/{recordId}:
    parameters: [{ $ref: '#/components/parameters/caseId' }, { $ref: '#/components/parameters/recordId' }]
    get: { tags: [interviews], summary: 比对页视图（逐轮高亮片段 UTF-16 下标、比对表行含 statementVersion/statementRevision/isStale、页眉计数、时间对照、Superseded 留痕；外部角色调阅写 testimony.read 审计）, responses: { '200': { description: ok }, '404': { $ref: '#/components/responses/Problem' } } }
  /api/v1/cases/{caseId}/interview-compare/{recordId}/rows/{statementId}:confirm:
    parameters: [{ $ref: '#/components/parameters/caseId' }, { $ref: '#/components/parameters/recordId' }, { $ref: '#/components/parameters/statementId' }]
    post:
      tags: [interviews]
      summary: ✓确认并写入审计（陈述复核 + 待确认比对结论；过期结论 409 icmp_entry_stale；无待复核项 409 icmp_not_reviewable）
      requestBody: { content: { application/json: { schema: { type: object, properties: { note: { type: string } } } } } }
      responses: { '200': { description: ok }, '409': { $ref: '#/components/responses/Problem' } }
  /api/v1/cases/{caseId}/interview-compare/{recordId}/rows/{statementId}:reject:
    parameters: [{ $ref: '#/components/parameters/caseId' }, { $ref: '#/components/parameters/recordId' }, { $ref: '#/components/parameters/statementId' }]
    post:
      tags: [interviews]
      summary: ✕驳回（陈述 → Rejected，待确认结论 → Dismissed；理由必填；已确认结论 409 icmp_entry_not_pending）
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 1 } } } } } }
      responses: { '200': { description: ok }, '409': { $ref: '#/components/responses/Problem' }, '422': { $ref: '#/components/responses/Problem' } }
  /api/v1/cases/{caseId}/interview-compare/{recordId}/statements/{statementId}:revise:
    parameters: [{ $ref: '#/components/parameters/caseId' }, { $ref: '#/components/parameters/recordId' }, { $ref: '#/components/parameters/statementId' }]
    post:
      tags: [interviews]
      summary: ✎修改陈述（仅 Draft/Modified；revision + 1、状态 Modified、写 statement.modify 审计；旧比对结论随即过期）
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [summary, reason], properties: { summary: { type: string }, claim: { $ref: 'schemas/interview.schema.json#/$defs/claim' }, referenceUtc: { type: [string, 'null'] }, reason: { type: string, minLength: 1 } } } } } }
      responses: { '200': { description: ok }, '409': { $ref: '#/components/responses/Problem' }, '422': { $ref: '#/components/responses/Problem' } }
  /api/v1/cases/{caseId}/interview-compare/{recordId}/rows/{statementId}:recheck:
    parameters: [{ $ref: '#/components/parameters/caseId' }, { $ref: '#/components/parameters/recordId' }, { $ref: '#/components/parameters/statementId' }]
    post:
      tags: [interviews]
      summary: 重新比对（结论带当前 statementVersion；未比对 → submit；Dismissed → resubmit，旧条目 Superseded；过期待确认 → 先 dismiss 再 resubmit；其余 409 icmp_recheck_not_allowed）
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [outcome, observedText], properties: { outcome: { type: string, enum: [Consistent, Contradictory, Unverifiable] }, observedText: { type: string }, sourceLabel: { type: string }, delta: { type: [number, 'null'] }, deltaUnit: { type: string }, rule: { type: string }, reason: { type: string } } } } } }
      responses: { '200': { description: ok }, '409': { $ref: '#/components/responses/Problem' }, '422': { $ref: '#/components/responses/Problem' } }

  /api/v1/cases/{caseId}/recommendations:
    parameters: [{ $ref: '#/components/parameters/caseId' }, { name: status, in: query, schema: { $ref: 'schemas/recommendation.schema.json#/$defs/status' } }]
    get:
      tags: [recommendations]
      summary: 安全建议列表
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Recommendation' } } } } } }
    post:
      tags: [recommendations]
      summary: 新建安全建议（Draft；causeNodeIds 至少一个；dueUtc 晚于创建时间）
      responses: { '201': { description: ok } }
  /api/v1/cases/{caseId}/recommendations:board:
    parameters: [{ $ref: '#/components/parameters/caseId' }]
    get: { tags: [recommendations], summary: '看板四栏：草拟=Draft、已发布=Issued、落实中=Responded、已关闭=Implemented/NotAdopted/Closed', responses: { '200': { description: '{allowed, columns}' } } }
  /api/v1/cases/{caseId}/recommendations/{recId}:
    parameters: [{ $ref: '#/components/parameters/caseId' }, { $ref: '#/components/parameters/recId' }]
    get: { tags: [recommendations], summary: 单条建议, responses: { '200': { description: ok } } }
    patch: { tags: [recommendations], summary: progressPct（仅 Responded，= SetProgress）/ 内容字段（仅 Draft）；不改状态, responses: { '200': { description: ok } } }
  /api/v1/cases/{caseId}/recommendations/{recId}:transition:
    parameters: [{ $ref: '#/components/parameters/caseId' }, { $ref: '#/components/parameters/recId' }]
    post:
      tags: [recommendations]
      summary: 状态转换（= SafetyRecommendationBoard.Transition；非法 409 safetyrec_illegal_transition；NotAdopted 需 note；Responded 只能经 responses）
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [to], properties: { to: { $ref: 'schemas/recommendation.schema.json#/$defs/status' }, note: { type: string } } } } } }
      responses: { '200': { description: ok }, '409': { $ref: '#/components/responses/Problem' } }
  /api/v1/cases/{caseId}/recommendations/{recId}/responses:
    parameters: [{ $ref: '#/components/parameters/caseId' }, { $ref: '#/components/parameters/recId' }]
    post: { tags: [recommendations], summary: 登记书面回复（= RecordResponse；Issued 自动转 Responded）, responses: { '201': { description: ok } } }
  /api/v1/cases/{caseId}/recommendations/{recId}/history:
    parameters: [{ $ref: '#/components/parameters/caseId' }, { $ref: '#/components/parameters/recId' }]
    get: { tags: [recommendations], summary: 该建议的审计记录, responses: { '200': { description: 'AuditEvent[]' } } }
  /api/v1/cases/{caseId}/consultation/rounds:
    parameters: [{ $ref: '#/components/parameters/caseId' }]
    get:
      tags: [recommendations]
      summary: 征求意见轮次（含 partyStatus / daysRemaining 推导）
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ConsultationRound' } } } } } }
    post: { tags: [recommendations], summary: 开启新一轮（上一轮须已关闭）, responses: { '201': { description: ok } } }
  /api/v1/cases/{caseId}/consultation/rounds/{roundNo}/replies:
    parameters: [{ $ref: '#/components/parameters/caseId' }, { $ref: '#/components/parameters/roundNo' }]
    post: { tags: [recommendations], summary: 登记一方回复及其意见条目, responses: { '201': { description: ok } } }
  /api/v1/cases/{caseId}/consultation/rounds/{roundNo}/comments/{commentId}:
    parameters: [{ $ref: '#/components/parameters/caseId' }, { $ref: '#/components/parameters/roundNo' }, { name: commentId, in: path, required: true, schema: { type: string } }]
    patch: { tags: [recommendations], summary: 采纳决定（非 Adopted 需 feedback）, responses: { '200': { description: ok } } }
  /api/v1/cases/{caseId}/consultation/rounds/{roundNo}:close:
    parameters: [{ $ref: '#/components/parameters/caseId' }, { $ref: '#/components/parameters/roundNo' }]
    post: { tags: [recommendations], summary: 关闭本轮（各方均已回复/放弃或已过期限，否则 409 consultation_cannot_close）, responses: { '200': { description: ok } } }
  /api/v1/cases/{caseId}/consultation/rounds/{roundNo}/waivers:
    parameters: [{ $ref: '#/components/parameters/caseId' }, { $ref: '#/components/parameters/roundNo' }]
    post: { tags: [recommendations], summary: 登记一方放弃回复（reason 必填，= WaiveReply）, responses: { '201': { description: ok } } }

  /api/v1/core/cpa:
    post:
      tags: [colreg]
      summary: 直通 mcis-core cpa
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CpaRequest' } } } }
      responses: { '200': { description: mcis-core envelope }, '503': { $ref: '#/components/responses/Problem' } }
  /api/v1/core/version:
    get: { tags: [colreg], summary: mcis-core 版本与可用子命令, responses: { '200': { description: ok } } }
  /api/v1/core/align:
    post:
      tags: [colreg]
      summary: 直通 mcis-core align（VDR 导入 + 时钟对齐 + 冲突检测）
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { description: 'mcis-core envelope；result.conflicts 符合 Conflict' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/cases/{caseId}/cpa:
    parameters:
      - { $ref: '#/components/parameters/caseId' }
      - { name: fromSec, in: query, schema: { type: number, default: 0 } }
      - { name: toSec, in: query, schema: { type: number } }
      - { name: stepSec, in: query, schema: { type: number, default: 15 } }
      - { name: ownVesselId, in: query, schema: { type: string } }
      - { name: targetVesselId, in: query, schema: { type: string } }
    get:
      tags: [colreg]
      summary: 两船 DCPA/TCPA 序列（mcis-core 批量计算）
      description: 时间参数必须有限、步长为正且能推进浮点采样；名义区间最多5000步，含1e-9端点容差后最多5001点。超出预算返回BAD_RANGE，不调用核心。
      responses:
        '200': { description: '{thresholds, results: CpaResult[]}' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/v1/cases/{caseId}/colreg:
    parameters: [{ $ref: '#/components/parameters/caseId' }]
    get:
      tags: [colreg]
      summary: 当前 COLREG 分析（时间带 + 核查项）
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Colreg' } } } } }
  /api/v1/cases/{caseId}/colreg:evaluate:
    parameters:
      - { $ref: '#/components/parameters/caseId' }
      - { name: confirmToken, in: query, required: false, schema: { type: string }, description: "非虚构案件二次确认的一次性令牌" }
    post:
      tags: [colreg]
      summary: 运行规则引擎（mcis-core colreg）；结果为 Draft，需调查员复核
      requestBody:
        required: false
        description: 可选；未给字段回退到案件存档的 colreg inputs
        content:
          application/json:
            schema:
              type: object
              properties:
                ownVesselId: { type: string }
                targetVesselId: { type: string }
                visibilityNm: { type: number }
                vesselsInSight: { type: boolean }
                inNarrowChannel: { type: boolean }
                vesselStatus: { type: object, description: "以船 id 为键，值为按时间排序的列表 [{fromUtc (ISO 8601 UTC), status}]；status 取 colreg.schema.json 中 vesselStatus 的枚举值", additionalProperties: { type: array, items: { type: object, required: [fromUtc, status], properties: { fromUtc: { type: string, format: date-time }, status: { type: string } } } } }
                inSightSamples: { type: array, items: { type: object } }
                evidenceIds: { type: array, items: { type: string } }
                thresholds: { type: object }
      responses:
        '200':
          description: Colreg 文档，须带本次新建版本的 runId
          content: { application/json: { schema: { $ref: '#/components/schemas/ColregEvaluateResult' } } }
        '409':
          description: |
            非虚构案件（isFictionalDemo=false）运行 evaluate 必须二次确认。
            首次不带 confirmToken：409 colreg_evaluate_confirm_required，detail 为
            {caseId, isFictionalDemo:false, confirmToken, expiresInSec:300, nextVersion}。
            令牌绑定案件与操作员、一次性、5 分钟有效；错误/复用/他人/过期/跨案令牌返回
            409 colreg_evaluate_confirm_invalid。409 时不写版本、不跑引擎、不写 evaluate 审计。
          content: { application/json: { schema: { $ref: 'schemas/common.schema.json#/$defs/problem' } } }
        '422': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /api/v1/cases/{caseId}/colreg/checks/{checkId}:
    parameters:
      - { $ref: '#/components/parameters/caseId' }
      - { name: checkId, in: path, required: true, schema: { type: string } }
      - { name: runId, in: query, required: false, schema: { type: string }, description: "目标版本；省略或 active 表示当前激活版本。请求体只接受 action、verdict、reason、evidenceIds，其他字段（含旧名 reviewStatus/note）返回 422" }
    patch:
      tags: [colreg]
      summary: 调查员复核核查项；审计记为 colreg.review，理由全文保存，不截断
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [confirm, dismiss, modify] }
                verdict: { type: string, description: "仅在 modify 时允许传，取 colreg.schema.json 的 verdict 枚举（可以是 Undetermined）。confirm/dismiss 时传了返回 422 colreg_review_verdict_not_allowed；与原判定相同返回 422 colreg_review_no_change" }
                reason: { type: string, description: "dismiss 和 modify 时必填，不能为空白" }
                evidenceIds: { type: array, items: { type: string }, description: "用共享 Evidence 校验器检查；编号未登记返回 422 evidence_not_registered" }
      responses:
        '200': { description: ok }
        '422': { $ref: '#/components/responses/Problem' }

  /api/v1/cases/{caseId}/colreg/runs:
    parameters: [{ $ref: '#/components/parameters/caseId' }]
    get:
      tags: [colreg]
      summary: COLREG 分析版本列表（种子 / 各次规则引擎 / 外部导入），标出当前激活版本
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/ColregRunList' } } } }
  /api/v1/cases/{caseId}/colreg/runs/{runId}:
    parameters:
      - { $ref: '#/components/parameters/caseId' }
      - { name: runId, in: path, required: true, schema: { type: string }, description: "版本 id，或 active" }
    get:
      tags: [colreg]
      summary: 单个分析版本（analysis + annotations：时间带 evidenceIds、复核人/时间、engineVerdict、理由全文）
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/ColregRun' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/cases/{caseId}/colreg/runs/{runId}:activate:
    parameters:
      - { $ref: '#/components/parameters/caseId' }
      - { name: runId, in: path, required: true, schema: { type: string } }
    post:
      tags: [colreg]
      summary: 将指定版本设为当前（只换指针，不改版本内容）；写审计 colreg.activate
