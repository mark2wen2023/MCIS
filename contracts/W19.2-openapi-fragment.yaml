  /api/v1/knowledge/suggestions:
    post:
      tags: [knowledge]
      summary: 公开或合成来源的模板候选预览，非模型推理，不持久化
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, source]
              properties:
                kind: { $ref: 'schemas/knowledge-card.schema.json#/properties/kind' }
                source: { $ref: 'schemas/knowledge-card.schema.json#/properties/source' }
      responses:
        '200': { description: 未保存模板预览，详见W19.2-suggestion-preview.md }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
