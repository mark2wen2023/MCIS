<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="demo-csrf" content="__DEMO_CSRF__"><title>MCIS · 隔离调查演示</title><link rel="stylesheet" href="/demo.css"><script defer src="/demo.js"></script></head><body><main><header><span class="brand">MCIS / LAB</span><span class="badge">虚构数据 · 本机隔离</span></header><h1>从来源到核查结果</h1><p class="intro">亲手运行一次受保护的调查流程。这里没有真实案件或生产账号。</p><div class="grid"><section class="card"><h2>01　选择演示来源</h2><p>同一时刻的两份虚构航向记录，仅用于检查系统链路。</p><fieldset><legend>本次核查范围</legend><label><input type="radio" name="choice" value="1"> 来源一 <strong>45°</strong></label><label><input type="radio" name="choice" value="2"> 来源二 <strong>50°</strong></label><label><input type="radio" name="choice" value="both" checked> 对比两份来源 <strong>45° ↔ 50°</strong></label></fieldset><button id="run" type="button">开始隔离核查</button><p id="status" role="status" aria-live="polite">尚未运行。每次都是全新的临时演示。</p></section><section class="card"><h2>02　核查结果</h2><div id="result" hidden><div id="metric" class="metric"></div><p id="summary"></p><p id="run-id" class="small"></p></div><p id="empty" class="empty">选择来源后，系统将读取目录、冻结版本、计算、临时保存，再读取结果。</p><div class="warning"><strong>未审核，不是事故结论</strong><p>时钟尚未校准；来源数量不证明独立印证。这里只演示虚构数据，核心实现版本未认证。</p></div></section></div><footer>本页不接收真实资料、账号或令牌。每次结束即清理临时数据，不形成持久案件档案。最多运行五次，服务五分钟自动停止。</footer></main></body></html>
