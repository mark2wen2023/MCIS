<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>音频逐段核对候选</title>
<style>body{font:16px sans-serif;max-width:1100px;margin:2em auto;padding:1em}label{display:block;margin:.7em 0}input,textarea{padding:.5em;max-width:95%}textarea{width:95%}pre{white-space:pre-wrap;overflow-wrap:anywhere}button{padding:.6em;margin:.3em}article{border-top:1px solid #aaa;padding:1em 0}.notice{background:#fff1d6;padding:1em}audio{width:100%}</style>
<h1>原音与逐段核对 · 隔离候选</h1><p class="notice">未接真实ASR。机器草稿仅为待核对输入，合成数据不是识别结果。听不清保持空文字，时间未知不补零；说话人未知。人工核对不等于事实认证或批准笔录。仅支持短PCM WAV；本候选案件暂不支持整包归档。</p>
<label>案件ID<input id="case"></label><label>核对运行ID<input id="run"></label><button id="list">列出已保存运行</button><button id="load">读取运行</button><pre id="runs"></pre>
<details><summary>关联已登记原音与v2机器草稿</summary><label>原音登记回执<input id="audio-digest"></label><button id="source">读取来源绑定（不证明人已听）</button><pre id="source-context"></pre><label>机器草稿JSON登记回执<input id="draft-digest"></label><label><input type="checkbox" id="ack">确认归档限制并保留原音、机器原稿</label><button id="attach">建立核对运行</button></details>
<p id="status" role="status"></p><h2>回听原音</h2><p>显式载入会记录下载访问，不证明实际听取。片段按相对原音毫秒定位，浏览器停止时机不保证采样级精度。时间未知只能回听整段原音，不猜定位。</p><button id="listen">授权载入原音</button><button id="clear">清除原音</button><audio id="player" controls preload="metadata"></audio><p id="play-status" role="status"></p><pre id="metadata"></pre><div id="segments"></div>
<script>
'use strict';
const el=id=>document.getElementById(id);let state=null,context=null,dirty=false,busy=false,url=null,generation=0,stopAt=null;
function clearAudio(){generation++;el('player').pause();el('player').removeAttribute('src');el('player').load();if(url)URL.revokeObjectURL(url);url=null;stopAt=null;el('play-status').textContent='原音未载入';}
window.addEventListener('pagehide',clearAudio);for(const id of ['case','run'])el(id).addEventListener('input',clearAudio);
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
el('clear').onclick=clearAudio;el('player').addEventListener('timeupdate',()=>{if(stopAt!==null&&el('player').currentTime>=stopAt){el('player').pause();stopAt=null;}});
const base=c=>'/api/v1/cases/'+encodeURIComponent(c);
async function json(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.message||'请求失败');return d;}
async function action(fn){if(busy)return;busy=true;try{await fn();}catch(e){el('status').textContent=e.message+'；输入保留，不自动重试。';}finally{busy=false;}}
function active(){if(!state||context!==el('case').value||state.runId!==el('run').value)throw Error('案件或运行已变化，请先读取；原输入尚未保存');}
function canReplace(){return !dirty||confirm('未保存输入仅在页面内存，继续读取将丢失。继续？');}
function checked(d,c){if(d?.caseId!==c||typeof d.runId!=='string'||!Number.isInteger(d.revision)||!Array.isArray(d.humanRevisions)||!d.initial?.machineDraft)throw Error('响应不能确认');return d;}
el('source').onclick=()=>action(async()=>{const c=el('case').value;el('source-context').textContent=JSON.stringify(await json(base(c)+'/audio-reviews/source/'+encodeURIComponent(el('audio-digest').value)),null,2);});
el('list').onclick=()=>action(async()=>{el('runs').textContent=JSON.stringify(await json(base(el('case').value)+'/audio-reviews'),null,2);});
el('load').onclick=()=>action(async()=>{if(!canReplace())return;const c=el('case').value,id=el('run').value;const d=checked(await json(base(c)+'/audio-reviews/'+encodeURIComponent(id)),c);if(d.runId!==id)throw Error('运行不符');state=d;context=c;render();});
el('attach').onclick=()=>action(async()=>{if(!canReplace())return;const c=el('case').value,d=checked(await json(base(c)+'/audio-reviews',{audioReceipt:el('audio-digest').value,draftReceipt:el('draft-digest').value,acknowledgeArchiveBlocked:el('ack').checked}),c);state=d;context=c;el('run').value=d.runId;render();});
el('listen').onclick=()=>action(async()=>{if(!state||context!==el('case').value||state.runId!==el('run').value)throw Error('先读取当前案件与运行');clearAudio();const token=generation,initial=state.initial;const r=await fetch(base(context)+'/evidence-intakes/'+initial.audioReceipt+':download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({purpose:'音频人工核对：'+state.runId})});if(!r.ok)throw Error('原音下载未成功');const bytes=await r.arrayBuffer();const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),n=>n.toString(16).padStart(2,'0')).join('');if(token!==generation)return;if(hash!==initial.machineDraft.source.currentSha256||hash!==r.headers.get('X-Sha256'))throw Error('原音版本不一致');url=URL.createObjectURL(new Blob([bytes],{type:'audio/wav'}));el('player').src=url;el('play-status').textContent='原音已载入；尚未证明实际听取。请选择播放或片段。';});
function render(){clearAudio();dirty=false;el('status').textContent='案件 '+context+' / '+state.runId+' / 修订 '+state.revision+'。草稿仅页面内存；刷新可能丢失。';el('metadata').textContent=JSON.stringify({source:state.initial.machineDraft.source,receipt:state.initial.machineDraft.receipt,inspection:state.initial.machineContractInspection},null,2);el('segments').replaceChildren();const t=state.initial.machineDraft.transcript;
for(const original of [...t.segments,...t.unlocatedSegments]){const box=document.createElement('article'),header=document.createElement('pre'),input=document.createElement('textarea'),status=document.createElement('select'),start=document.createElement('input'),end=document.createElement('input'),reason=document.createElement('input'),play=document.createElement('button'),save=document.createElement('button'),history=document.createElement('pre');const revisions=state.humanRevisions.filter(r=>r.segmentId===original.id),last=revisions.at(-1);header.textContent='片段 '+original.id+' / 机器原稿（未核验）：'+original.text+' / 原时间：'+('startMs'in original?original.startMs+'–'+original.endMs+'ms':'未知（'+original.reason+'）');input.value=last?last.text:original.text;input.setAttribute('aria-label','核对文字 '+original.id);input.rows=3;
for(const [v,label] of [['pending','待核对'],['transcription_checked','人工核对文字（非事实确认）'],['unintelligible','听不清（文字须为空）']]){const o=document.createElement('option');o.value=v;o.textContent=label;status.append(o);}status.value=last?last.hearingStatus:'pending';start.value=(last?last.startMs:original.startMs)??'';end.value=(last?last.endMs:original.endMs)??'';for(const [node,label] of [[start,'起始毫秒，留空未知'],[end,'结束毫秒，留空未知']]){node.placeholder=label;node.setAttribute('aria-label',label);}reason.placeholder='修改/核对理由（必填）';reason.setAttribute('aria-label','核对理由');for(const n of [input,status,start,end,reason])n.oninput=()=>{dirty=true;};
function times(){if(start.value===''&&end.value==='')return [null,null];const a=Number(start.value),b=Number(end.value);if(start.value===''||end.value===''||!Number.isInteger(a)||!Number.isInteger(b)||a<0||a>=b||b>state.initial.machineDraft.source.durationMs)throw Error('填写有效范围，或两项都留空表示未知');return [a,b];}
play.textContent='按当前输入范围回听（未保存时间仍是草稿）';play.onclick=()=>action(async()=>{active();const [a,b]=times();if(a===null)throw Error('时间未知；请用播放器整段回听，不猜定位');if(!url||el('player').readyState<1)throw Error('请先载入并等待原音可播放');stopAt=b/1000;el('player').currentTime=a/1000;await el('player').play();el('play-status').textContent='回听片段 '+original.id+'，输入范围 '+a+'–'+b+'ms；不构成已听证明。';});
save.textContent='追加本段人工修订';save.onclick=()=>action(async()=>{active();const [a,b]=times(),expected=state.revision,body={expectedRevision:expected,segmentId:original.id,text:input.value,hearingStatus:status.value,startMs:a,endMs:b,reason:reason.value};const d=checked(await json(base(context)+'/audio-reviews/'+state.runId+'/revisions',body),context),r=d.humanRevisions.at(-1);if(d.runId!==state.runId||d.revision!==expected+1||JSON.stringify(d.initial)!==JSON.stringify(state.initial)||d.humanRevisions.length!==state.humanRevisions.length+1||JSON.stringify(d.humanRevisions.slice(0,-1))!==JSON.stringify(state.humanRevisions)||['segmentId','text','hearingStatus','startMs','endMs','reason'].some(k=>r?.[k]!==body[k]))throw Error('保存结果未知，请核查，不重复提交');state=d;history.textContent=JSON.stringify(d.humanRevisions.filter(r=>r.segmentId===original.id),null,2);el('status').textContent='本段已保存；其他未保存输入仍保留。修订 '+state.revision;});history.textContent=JSON.stringify(revisions,null,2);box.append(header,input,status,start,end,reason,play,save,history);el('segments').append(box);}}
</script></html>
