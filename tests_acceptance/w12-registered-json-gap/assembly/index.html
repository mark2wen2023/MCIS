<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>W12 registered JSON gap assembly</title>
  <link rel="stylesheet" href="./analysis.css" />
  <style>
    html, body { margin: 0; max-width: 100%; overflow-x: hidden; background: #07111d; color: #e6f1ff; font-family: sans-serif; }
    #switcher { display: flex; gap: 8px; padding: 8px 12px; flex-wrap: wrap; }
    #switcher button { background: #123; color: #e6f1ff; border: 1px solid #33506e; padding: 6px 10px; cursor: pointer; }
    #switcher button.on { background: #1c3f63; }
    #status-panel, #denied-panel, #unpaired-panel { padding: 12px 16px; }
    .an-metric-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
    .an-metric-table caption { caption-side: top; text-align: left; color: #8da4c4; font-size: 11px; padding: 4px 0 6px; }
    .an-metric-table th, .an-metric-table td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #33506e; color: #e6f1ff; }
    .an-metric-table:focus, .an-metric-table:focus-visible { outline: 2px solid #3be3ff; outline-offset: 2px; }
    .mono { font-family: ui-monospace, monospace; font-size: 12px; }
  </style>
</head>
<body>
  <div id="root">正在从本机读服务装配…</div>
  <script src="./app.js"></script>
</body>
</html>
